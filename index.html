<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SpaceInvaders</title>
    <link rel="stylesheet" href="style.css">
</head>
<body >

<img class="title" src="img/Space_Invaders.webp" height="720" width="1280"/>

    <div class="wrapper">
        <div class="world"></div>
        <div  class="popup">
            <div id="popup" class="popup_content">
                <span>GAME OVER</span>
                <label for="input">Username:</label>
                <input id="input" disabled type="text" value="...">
                <button disabled>Submit Score</button>
                <button disabled>New Game</button>
            </div>
        </div>

        <div class="gamewindow" >

            <div class="scoreview">
                <div class="score_text">
                    <span>SCORE</span>
                    <span>HI-SCORE</span>
                    <span>LIVES</span>
                </div>
                <div class="score">
                    <span id="curScore">00000</span>
                    <span>00000</span>
                    <span>XXX</span></div>

            </div>

            <div class="grid-container" id="grid"></div>

        </div>
    </div>


<script type="module" src="./src/main.js"></script>
</body>
</html>
